services:
  - name: fx-rates-cron
    type: cron
    schedule: "0 6 * * *"
    command: curl -X GET "https://${DOMAIN}/api/cron/fx-rates" -H "Authorization: Bearer ${CRON_SECRET}"
    environment:
      - EXCHANGERATE_API_KEY=${EXCHANGERATE_API_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - DOMAIN=${DOMAIN}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
